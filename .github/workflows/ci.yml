name: Test, analyze and build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  phpstan:
    name: Run regression tests and PHPStan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP environment
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: ${{ matrix.php }}
          install-path: ./.php-bin
          pm-version-major: "5"

      - name: Restore Composer package cache
        id: composer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "~/.cache/composer"
          key: "php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "php-${{ matrix.php }}-composer-"

      - name: Install PHPStan Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts --no-plugins

      - name: Verify installed PHP extensions and platform requirements
        run: composer check-platform-reqs

      - name: Test zone tool drop and cleanup behavior
        run: php tests/zone-tools.php

      - name: Test island name uniqueness across all islands
        run: php tests/island-names.php

      - name: Test island file loading and malformed JSON handling
        run: php tests/island-data-read.php

      - name: Test master world loading and missing-world behavior
        run: php tests/master-world.php

      - name: Test island creation after loading the master world
        run: php tests/create-world-load.php

      - name: Test complete chunk preparation before island creation
        run: php tests/island-chunk-preparation.php

      - name: Test help command details with current Commando API
        run: php tests/help-command.php

      - name: Test top island rankings and pagination
        run: php tests/top-islands.php

      - name: Test member rank promotion and demotion bounds
        run: php tests/member-ranks.php

      - name: Test message formatting and malformed configuration values
        run: php tests/message-constructor.php

      - name: Test island chat with offline channel members
        run: php tests/island-chat.php

      - name: Test generator ore configuration validation
        run: php tests/generator-ores.php

      - name: Test native item and block parsing
        run: php tests/item-parser.php

      - name: Test valuable block configuration validation
        run: php tests/valuable-blocks.php

      - name: Test configuration merge and invalid file preservation
        run: php tests/config-manager.php

      - name: Test message defaults and custom text preservation
        run: php tests/message-update.php

      - name: Test zone configuration and unavailable world preservation
        run: php tests/zone-configuration.php

      - name: Run PHPStan at maximum level
        run: vendor/bin/phpstan analyze --level=max
  build-phar:
    name: Build and validate plugin PHAR
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@6180fb4a04e5981ccb24128823970de3e8fd3830 # v1.0.12
    with:
      prepare-dependencies: true
      php-version: "8.2"
      pm-version-major: "5"

  runtime-smoke:
    name: Smoke test plugin startup on supported Axolotl-PM versions
    needs: build-phar
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out RedSkyBlockX test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out Axolotl-PM 5.36.0 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: 85dfee4262256a817439662daee501117e559341 # 5.36.0 source revision
          path: .devtools-compatibility/axolotl-5.36.0
          persist-credentials: false

      - name: Set up PHP environment
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: "8.2"
          install-path: ./.php-bin
          pm-version-major: "5"

      - name: Download the exact verified plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-phar.outputs.artifact-id }}
          path: ${{ runner.temp }}/devtools-build

      - name: Verify PHAR contents and build checksum
        env:
          EXPECTED_SHA256: ${{ needs.build-phar.outputs.sha256 }}
          PLUGIN_NAME: ${{ needs.build-phar.outputs.plugin-name }}
        shell: bash
        run: |
          set -euo pipefail
          PLUGIN_PHAR="$RUNNER_TEMP/devtools-build/$PLUGIN_NAME.phar"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$PLUGIN_PHAR" | sha256sum --check
          php tests/verify-phar.php "$PLUGIN_PHAR"

      - name: Download pinned Axolotl-PM 5.49.1 runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/axolotl-pm/PocketMine-MP/releases/download/5.49.1/PocketMine-MP.phar \
            --output "$RUNNER_TEMP/PocketMine-MP.phar"
          printf '%s  %s\n' \
            'b62ce263c079a00498a49cd3eab0bfa454f4ba195e5f9d62e32927cfc805c665' \
            "$RUNNER_TEMP/PocketMine-MP.phar" | sha256sum --check

      - name: Install Axolotl-PM 5.36.0 source dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins
        working-directory: .devtools-compatibility/axolotl-5.36.0

      - name: Smoke test isolated plugin startup on Axolotl-PM 5.49.1
        env:
          SERVER_PHAR: ${{ runner.temp }}/PocketMine-MP.phar
          PLUGIN_PHAR: ${{ runner.temp }}/devtools-build/${{ needs.build-phar.outputs.plugin-name }}.phar
        run: python3 .github/scripts/runtime-smoke.py

      - name: Smoke test minimum declared API 5.36.0
        env:
          SERVER_SOURCE: .devtools-compatibility/axolotl-5.36.0
          EXPECTED_SERVER_COMMIT: 85dfee4262256a817439662daee501117e559341
          PLUGIN_PHAR: ${{ runner.temp }}/devtools-build/${{ needs.build-phar.outputs.plugin-name }}.phar
        run: python3 .github/scripts/runtime-smoke.py
