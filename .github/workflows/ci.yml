name: Analyze PHP code and build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  phpstan:
    name: Analyze PHP code with PHPStan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP environment
        uses: shivammathur/setup-php@c5fc0d8281aba02c7fda07d3a70cc5371548067d # 2.25.2
        with:
          php-version: ${{ matrix.php }}

      - name: Restore Composer package cache
        id: composer-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: "~/.cache/composer"
          key: "php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "php-${{ matrix.php }}-composer-"

      - name: Install PHPStan Composer dependencies
        run: composer install --prefer-dist --no-interaction --ignore-platform-reqs

      - name: Run PHPStan analysis
        run: vendor/bin/phpstan analyze
  build-phar:
    name: Build plugin PHAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP environment
        uses: shivammathur/setup-php@c5fc0d8281aba02c7fda07d3a70cc5371548067d # 2.25.2
        with:
          php-version: "8.2"
      - name: Build plugin PHAR with Pharynx
        uses: SOF3/pharynx@v0.1
        id: pharynx
        with:
          pharynx-version: "0.3.0"
      - name: Upload plugin PHAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RedSkyBlockX.phar
          path: ${{steps.pharynx.outputs.output-phar}}
      - name: Upload expanded build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RedSkyBlockX
          path: ${{steps.pharynx.outputs.output-dir}}
